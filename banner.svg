<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="starGlow">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Background field stars -->
  <g fill="#334155">
    <circle cx="50" cy="30" r="1"/>
    <circle cx="380" cy="40" r="1"/>
    <circle cx="60" cy="260" r="1"/>
    <circle cx="420" cy="270" r="1"/>
    <circle cx="360" cy="80" r="1"/>
    <circle cx="40" cy="190" r="1"/>
    <circle cx="390" cy="200" r="1"/>
    <circle cx="440" cy="60" r="1"/>
    <circle cx="90" cy="100" r="0.8"/>
    <circle cx="200" cy="30" r="0.8"/>
    <circle cx="300" cy="290" r="0.8"/>
    <circle cx="70" cy="220" r="0.8"/>
    <circle cx="350" cy="280" r="0.8"/>
  </g>

  <!-- Lupus asterism lines -->
  <g stroke="#3b82f6" stroke-width="1.1" fill="none" opacity="0.6">
    <line x1="120" y1="115" x2="134" y2="30"/>
    <line x1="134" y1="30"  x2="197" y2="55"/>
    <line x1="197" y1="55"  x2="120" y2="115"/>
    <line x1="120" y1="115" x2="190" y2="143"/>
    <line x1="190" y1="143" x2="228" y2="145"/>
    <line x1="228" y1="145" x2="270" y2="182"/>
    <line x1="190" y1="143" x2="208" y2="190"/>
    <line x1="208" y1="190" x2="223" y2="290"/>
    <line x1="120" y1="115" x2="223" y2="290"/>
    <line x1="223" y1="290" x2="279" y2="234"/>
  </g>

  <!-- Glows on brightest stars -->
  <circle cx="279" cy="234" r="16" fill="url(#starGlow)"/>
  <circle cx="270" cy="182" r="13" fill="url(#starGlow)"/>
  <circle cx="190" cy="143" r="13" fill="url(#starGlow)"/>
  <circle cx="223" cy="290" r="11" fill="url(#starGlow)"/>

  <!-- Constellation stars -->
  <g fill="#e2e8f0">
    <circle cx="279" cy="234" r="4.5"/>
    <circle cx="270" cy="182" r="4"/>
    <circle cx="190" cy="143" r="4"/>
    <circle cx="228" cy="145" r="3.5"/>
    <circle cx="208" cy="190" r="3"/>
    <circle cx="223" cy="290" r="3.5"/>
    <circle cx="120" cy="115" r="3"/>
    <circle cx="317" cy="224" r="2"/>
    <circle cx="197" cy="55"  r="2.5"/>
    <circle cx="244" cy="231" r="2"/>
    <circle cx="134" cy="30"  r="2.5"/>
  </g>

  <!-- Text block -->
  <g font-family="'SF Mono', 'Monaco', 'Consolas', 'Courier New', monospace">
    <text x="500" y="145" font-size="42" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">Eduardo Lima</text>
    <text x="500" y="180" font-size="16" font-weight="400" fill="#64748b" letter-spacing="3">AI &amp; ANALYTICS ENGINEER</text>
    <line x1="500" y1="200" x2="560" y2="200" stroke="url(#accent)" stroke-width="2"/>
  </g>
</svg>
